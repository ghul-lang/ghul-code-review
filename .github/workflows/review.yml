name: Code review

# Reusable workflow that runs `claude -p` directly with a heartbeat watchdog
# and a bounded review budget, posting the result as a single formal PR review
# (approve when clean, request-changes with inline findings otherwise).
# Designed to be called from a consumer repo's CI workflow via `uses:`.
#
# The reviewer is always the Claude Code CLI. Which model actually serves the
# request is a matter of which provider it points at: 'anthropic' talks to
# Anthropic's own API, 'qwen' points the CLI at Alibaba's Qwen Token Plan
# endpoint, 'openrouter' at OpenRouter's, and 'zai' at Z.AI's GLM Coding Plan -
# the latter three speak the native Anthropic Messages protocol, so the same
# CLI, tool policy and prompt work unmodified against all four; only the base
# URL, auth token and default model differ.
#
# Provider and model are fleet-wide by default, not per-repo: every run
# fetches fleet.json from this repo's own main branch (unauthenticated raw
# fetch, since this repo is public) for the live default `provider` and
# `tier` ('high'/'medium'/'low', mapped to a concrete model per provider).
# Editing that one file is what "switch every repo over, I've run out of
# tokens" means in practice - no per-repo commits or variables. A calling
# repo can still override provider/tier for itself via the `provider`/`tier`
# inputs or its own CODE_REVIEW_PROVIDER/CODE_REVIEW_TIER variables, and pin
# the exact model with the `model` input or its own CODE_REVIEW_MODEL
# variable: an explicit model always wins outright over tier mapping, so
# setting the variable rides one specific model through pricing changes, and
# clearing it drops back to whatever fleet.json maps the current tier to.
# Neither is needed for the normal case.
#
# Consumers:
#   jobs:
#     code_review:
#       if: ${{ github.event_name == 'pull_request' }}
#       uses: ghul-lang/ghul-code-review/.github/workflows/review.yml@v4
#       with:
#         prompt: |
#           Review pull request #${{ github.event.pull_request.number }} ...
#       secrets:
#         claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         qwen-auth-token: ${{ secrets.QWEN_AUTH_TOKEN }}
#
# A manually dispatched run reviews one pull request in full: the
# `pull-request-number` input overrides the event context, and the run
# skips the two mechanical short-circuits - the content-fingerprint
# re-post and the dependency-bot fast path - so the model re-reads the
# whole PR, whatever happened on the run that posted the standing verdict.
# It is the un-stick path: when an automatic run answered with something
# the author has since fixed in the description or answered in a comment,
# dispatching rather than re-running the event's own job guarantees a
# fresh verdict instead of a repetition of the old one.

on:
  workflow_call:
    inputs:
      prompt:
        description: "Full text of the review brief to send claude (-p)."
        type: string
        required: true
      provider:
        description: >-
          Which provider serves the review: 'anthropic' (Claude models via
          Anthropic's own API), 'qwen' (Alibaba's Qwen Token Plan, Anthropic-
          compatible endpoint), or 'openrouter' (OpenRouter's Anthropic-
          compatible endpoint, any catalog model), or 'zai' (Z.AI's GLM Coding
          Plan). All four run through the same claude CLI - only the base URL,
          auth token and default model differ. Empty string (the normal case) falls back to the calling
          repo's CODE_REVIEW_PROVIDER variable, then this repo's own
          fleet.json (fetched fresh each run - see the notes at the top of
          this file), then 'anthropic'. Set this input, or the repo variable,
          only to pin one repo away from the fleet default.
        type: string
        default: ""
      tier:
        description: >-
          A provider-independent quality/cost tier - 'high', 'medium' or
          'low' - mapped to a concrete model by fleet.json's `models` table
          for whichever provider is active. Empty string falls back to the
          calling repo's CODE_REVIEW_TIER variable, then fleet.json's own
          default tier, then 'medium'.
        type: string
        default: ""
      model:
        description: >-
          Explicit model id passed to --model, bypassing tier mapping
          entirely. Empty string falls back to the calling repo's
          CODE_REVIEW_MODEL variable; when both are empty (the normal case)
          the model resolves from `tier`. Use this only for pinning a
          specific model fleet.json's tier table doesn't cover.
        type: string
        default: ""
      allowed-tools:
        description: "Comma-separated --allowedTools argument."
        type: string
        default: "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(date:*),Bash(git log:*),Bash(wc:*),Read,Write,Glob,Grep"
      disallowed-tools:
        description: >-
          Space-separated --disallowedTools argument. allowed-tools is a permission
          allowlist, not a capability restriction: tools that never prompt stay
          reachable however narrow it is. A review that fans out to subagents
          multiplies its own token cost and runs out of wall clock before it posts
          anything, so the orchestration tools are denied outright.
        type: string
        default: "Agent Workflow Task"
      runner:
        description: >-
          GitHub Actions runner label the review job runs on. A small runner
          suffices - the job spends its time waiting on the model, not building.
          Defaults to a small Ubicloud runner, because GitHub's own runners do not
          always reach the Qwen Token Plan or OpenRouter endpoints.
        type: string
        default: ubicloud-standard-2
      idle-timeout-seconds:
        description: >-
          Kill claude if its stdout doesn't grow for this many seconds. Must
          comfortably exceed the model's time-to-first-token on a cold start -
          higher than a direct-Anthropic default needs, because the qwen and
          openrouter proxies add their own latency.
        type: number
        default: 180
      max-attempts:
        description: >-
          Maximum attempts before giving up. Defaults to 1: a retry re-reads the
          whole PR from a fresh context, so it competes with the surviving attempts
          for one shared job budget rather than adding to it. Failing the check and
          letting a push re-trigger the review is cheaper than a second attempt that
          gets guillotined mid-flight.
        type: number
        default: 1
      post-findings-after-minutes:
        description: >-
          Soft deadline handed to the review as a wall-clock instruction: reach a
          posted review by this point, whatever depth has been achieved. The outer
          job timeout is a backstop for a wedged run, not the working budget.
        type: number
        default: 4
      hard-stop-grace-seconds:
        description: >-
          Extra time after post-findings-after-minutes before the run is killed outright.
          The budget the review is told about is a working deadline; this is how long it
          gets to finish the post it was told to start. Whatever is in review.json when
          the kill lands is posted as a partial review.
        type: number
        default: 90
      transcript-retention-days:
        description: >-
          Retention for the uploaded review transcript. The full event stream carries
          every file the review read, so it is large and its value decays quickly -
          long enough to investigate a bad run, not to accumulate.
        type: number
        default: 14
      claude-version:
        description: "Claude CLI version to install on the runner."
        type: string
        default: "2.1.221"
      job-timeout-minutes:
        description: "Outer job timeout-minutes (belt-and-braces on top of the idle and deadline watchdogs)."
        type: number
        default: 8
      gh-app-id:
        description: "Optional GitHub App id. When supplied alongside gh-app-private-key, the review posts under this App's installation identity instead of github-actions[bot]."
        type: string
        default: ""
      dependency-fast-path:
        description: >-
          Approve a pull request from a dependency bot without running the
          model, when it touches only version-pin files and changes nothing in
          them but versions and hashes. Turn off for a repo that judges its own
          dependency bumps, or that wants every change read.
        type: boolean
        default: true
      maintainer-review:
        description: >-
          Let the review brief name changes that need the maintainer. With this
          set, such a change gets a request-changes review saying so instead of
          an approval, however routine it looks, and branch protection holds it
          for the maintainer. Off by default, so no other repository's review
          ever holds a pull request that way.
        type: boolean
        default: false
      require-description-section:
        description: >-
          Require the PR description to carry at least one 'Enhancements:' /
          'Bugs fixed:' / 'Technical:' section. Turn off for a repo that does
          not generate release notes from the squash-merge message; the other
          description checks apply either way.
        type: boolean
        default: true
      ghul-reference:
        description: "Fetch GHUL.md from ghul-lang/ghul main into the workspace root, for repos whose diffs contain ghūl source. The prompt can then point the review at it."
        type: boolean
        default: false
      style-reference:
        description: "Fetch STYLE.md from ghul-lang/ghul-style main into the workspace root, for repos whose diffs carry human-facing prose or example code. Requires gh-app-id, and ghul-style named in extra-repositories."
        type: boolean
        default: false
      extra-repositories:
        description: "Additional repository names (newline- or comma-separated, same owner) the App token should reach, for prompts that read a file from a sibling repo. The calling repository is always included."
        type: string
        default: ""
      pull-request-number:
        description: >-
          Number of the pull request to review, for a run dispatched manually
          on a caller workflow: it overrides the event context, and the run
          skips every mechanical short-circuit - the content-fingerprint
          re-post and the dependency-bot fast path - to review the PR in
          full. Empty (the normal case) takes the number and the
          short-circuits from the pull_request event.
        type: string
        default: ""
    secrets:
      claude-oauth-token:
        description: "OAuth token for Anthropic's own API (CLAUDE_CODE_OAUTH_TOKEN). Required when provider resolves to 'anthropic'."
        required: false
      qwen-auth-token:
        description: "API key for Alibaba's Qwen Token Plan endpoint. Required when provider resolves to 'qwen'."
        required: false
      openrouter-auth-token:
        description: "API key for OpenRouter. Required when provider resolves to 'openrouter'."
        required: false
      zai-auth-token:
        description: "API key for Z.AI's GLM Coding Plan endpoint. Required when provider resolves to 'zai'."
        required: false
      gh-app-private-key:
        description: "Optional PEM-format private key for the GitHub App identified by gh-app-id. Required only if gh-app-id is set."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code review
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    # The review is part of the merge gate, so a failure here fails the run.
    # A review that could not be posted leaves the diff unreviewed, which is
    # not a state to merge from — better to block and re-run than to let it
    # through on the strength of CI alone.
    env:
      # The PR number this run reviews: an explicit input wins (a manually
      # dispatched run), else the pull_request event's number.
      PR_NUMBER: ${{ inputs.pull-request-number || github.event.pull_request.number }}
      # Raw, unfallen-back values only - the full anthropic/medium fallback
      # chain runs in the "Resolve provider, tier and credentials" step below,
      # because fleet.json (fetched there) sits between the repo-level
      # override and the hardcoded last resort.
      PROVIDER_OVERRIDE: ${{ inputs.provider || vars.CODE_REVIEW_PROVIDER }}
      TIER_OVERRIDE: ${{ inputs.tier || vars.CODE_REVIEW_TIER }}
      MODEL_OVERRIDE: ${{ inputs.model || vars.CODE_REVIEW_MODEL }}
      PROMPT: ${{ inputs.prompt }}
      ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
      DISALLOWED_TOOLS: ${{ inputs.disallowed-tools }}
      POST_AFTER_MIN: ${{ inputs.post-findings-after-minutes }}
      HARD_STOP_GRACE_S: ${{ inputs.hard-stop-grace-seconds }}
      IDLE_TIMEOUT_S: ${{ inputs.idle-timeout-seconds }}
      MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      CLAUDE_VERSION: ${{ inputs.claude-version }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Mint App installation token
      id: app-token
      if: ${{ inputs.gh-app-id != '' }}
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.gh-app-id }}
        private-key: ${{ secrets.gh-app-private-key }}
        # The action scopes the token to the calling repository alone unless
        # told otherwise, so a prompt that reads from a sibling repo gets a 404
        # until that repo is named here.
        owner: ${{ github.repository_owner }}
        repositories: |
          ${{ github.event.repository.name }}
          ${{ inputs.extra-repositories }}

    - name: Fetch GHUL.md language reference
      if: ${{ inputs.ghul-reference }}
      run: curl -fsSL https://raw.githubusercontent.com/ghul-lang/ghul/main/GHUL.md -o GHUL.md

    # ghul-style is private, so this needs the App token widened to reach it.
    # Doing it here rather than from the prompt because the CLI's write guard
    # refuses the shell redirection a prompt-driven fetch would need.
    - name: Fetch STYLE.md style guide
      if: ${{ inputs.style-reference }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        gh api repos/ghul-lang/ghul-style/contents/STYLE.md -H "Accept: application/vnd.github.raw" > STYLE.md

    - name: Pre-fetch PR context
      if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        PR_NUMBER: ${{ env.PR_NUMBER }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p .review-context

        # The base and head SHAs come from the API rather than the event
        # context, so a manual dispatch - whose event carries no pull request
        # - reads the same context as a PR-triggered run.
        gh pr view "$PR_NUMBER" --repo "$REPO" \
          --json number,title,body,baseRefName,headRefName,baseRefOid,headRefOid,headRepository,additions,deletions,changedFiles,author,labels,commits,files \
          > .review-context/pr.json
        BASE_SHA=$(jq -r .baseRefOid .review-context/pr.json)
        HEAD_SHA=$(jq -r .headRefOid .review-context/pr.json)
        export BASE_SHA HEAD_SHA

        # The review reads the PR's diff and description with this repo's
        # secrets in reach and posts back to it, so it never runs against
        # content from another repository. Callers gate their own triggers on
        # the head repo; this restates it here because a manual dispatch
        # carries no event context to gate on, and it holds for every path.
        head_full=$(jq -r '.headRepository.nameWithOwner // ""' .review-context/pr.json)
        if [ "$head_full" != "$REPO" ]; then
          echo "::error::PR #$PR_NUMBER's head is $head_full, not $REPO - not reviewing a fork's pull request"
          exit 1
        fi

        # GitHub's diff endpoint refuses any diff of more than 300 files, so a
        # large mechanical change - a mass rename, a sweeping cleanup - would
        # otherwise fail the whole review rather than be reviewed. The checkout
        # is the pull request's merge commit, so diffing it against the base
        # commit reproduces the same changes. The history has to be deepened
        # first, which is why that is done here and not by checking out in full:
        # every other review pays for a shallow clone and only this path does
        # not. (A manual dispatch checks out the branch it was dispatched
        # on, and diffs BASE_SHA against HEAD_SHA from the API, so it reads
        # the PR's own diff either way.)
        if ! gh pr diff "$PR_NUMBER" --repo "$REPO" > .review-context/diff.patch 2>.review-context/diff.err ; then
          if grep -q "exceeded the maximum number of files" .review-context/diff.err ; then
            echo "diff exceeds GitHub's 300 file limit; computing it locally"
            git fetch --quiet --unshallow 2>/dev/null || git fetch --quiet --deepen=2000 2>/dev/null || true
            git fetch --quiet origin "$BASE_SHA" 2>/dev/null || true
            git diff "$BASE_SHA" "$HEAD_SHA" > .review-context/diff.patch
          elif grep -q "terminal escape sequences" .review-context/diff.err ; then
            # gh refuses to print a diff that holds escape characters, which
            # a test asserting terminal output legitimately does. The diff goes
            # to a file the reviewer reads, so take it, with each escape shown
            # as the visible control picture rather than as the raw byte.
            echo "diff holds escape characters; fetching it with them shown as control pictures"
            gh pr diff "$PR_NUMBER" --repo "$REPO" --allow-escape-sequences \
              | sed 's/\x1b/␛/g' > .review-context/diff.patch
          else
            cat .review-context/diff.err >&2
            exit 1
          fi
        fi
        rm -f .review-context/diff.err

        gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" > .review-context/comments.json
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews"   > .review-context/reviews.json
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments"  > .review-context/review-comments.json

        # The reviewer is re-run on every push and each run is a fresh context,
        # so what it reads is the whole diff again with nothing marking which
        # hunks answer its last review. This is that marker: the diff from the
        # commit the previous review was posted against to the current head.
        # It is a pointer into diff.patch rather than a replacement for it -
        # the verdict is on the merged result, and a later push can break code
        # an earlier round read and passed.
        #
        # Written only when it says something diff.patch does not. There is no
        # previous review on the first run; and after a force-push the merge
        # base is the branch point again, so the compare reproduces the full
        # diff, which is dropped rather than written out as a second copy.
        # A COMMENTED review is excluded because that is what the pull
        # request's own author posts when replying to findings - GitHub
        # refuses an author an approval or a change request, so the two
        # verdicts this workflow posts are the two an author cannot. Taking
        # the newest bot review of any state would sometimes anchor on the
        # author's reply instead, and land on a commit newer than the one the
        # reviewer last saw - hiding hunks it has never read.
        previous_sha=$(
          jq -r '[.[] | select(.user.type == "Bot" and .state != "COMMENTED") | .commit_id // empty] | last // empty' \
            .review-context/reviews.json
        )

        if [ -n "$previous_sha" ] && [ "$previous_sha" != "$HEAD_SHA" ] ; then
          if gh api "repos/${REPO}/compare/${previous_sha}...${HEAD_SHA}" \
               -H "Accept: application/vnd.github.diff" \
               > .review-context/since-last-review.patch 2>/dev/null \
             && [ -s .review-context/since-last-review.patch ] \
             && ! cmp -s .review-context/since-last-review.patch .review-context/diff.patch ; then
            echo "diff since the previous review: ${previous_sha:0:12}..${HEAD_SHA:0:12}"
          else
            rm -f .review-context/since-last-review.patch
          fi
        fi
        echo "Pre-fetched PR context:"
        ls -lh .review-context/

    # Claude Code cloud sessions append an advert to every pull request they
    # open - a '🤖 Generated with [Claude Code]' line and a session link -
    # whatever the session was told. Removed from the pull request itself, so
    # it never reaches the squash-merge commit, rather than raised as a
    # finding the author has no way to stop recurring.
    #
    # Only whole lines that are nothing but the advert are removed, along with
    # a '---' rule left dangling at the end by their removal. Anything else,
    # a session link inside a sentence for instance, stays for the description
    # checks to report.
    #
    # Runs before every gate, the human-approval skip included, because the
    # body ships however the review is decided. The body is re-read just
    # before the edit so an edit the author made since the pre-fetch is not
    # overwritten, and pr.json takes the result so the fingerprint and the
    # description checks see what the pull request now says.
    #
    # The edit uses the workflow's own token: an edit made with it does not
    # start another run, where one made as the App would re-trigger a caller
    # that listens for 'edited'. If the edit fails the body is left as it was,
    # and the description checks report the advert as before.
    - name: Strip the Claude Code advert from the PR description
      if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ env.PR_NUMBER }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail

        if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '{body: (.body // "")}' > .review-context/body-current.json ; then
          echo "::warning::could not re-read the PR description - leaving it as it is"
          exit 0
        fi

        jq '
          def advert:
            test("^\\s*(🤖 Generated with \\[?Claude Code\\]?(\\([^)]*\\))?\\.?"
                 + "|_?Generated by \\[Claude Code\\]\\([^)]*\\)_?"
                 + "|(Claude-Session:\\s*)?<?https://claude\\.ai/code/session_[A-Za-z0-9_]+>?)\\s*$");
          def blank: test("^\\s*$");
          def trim_tail: if length > 0 and (.[-1] | blank) then .[:-1] | trim_tail else . end;

          .body as $original
          | ($original | split("\n")) as $lines
          | ($lines | map(select(advert | not))) as $kept
          | if ($kept | length) == ($lines | length) then {body: $original, stripped: false}
            else ($kept | trim_tail
                  | if length > 0 and (.[-1] | test("^\\s*---\\s*$")) then .[:-1] | trim_tail else . end
                  | if length > 0 then .[-1] |= sub("\\s+$"; "") else . end
                  | {body: join("\n"), stripped: true})
            end
        ' .review-context/body-current.json > .review-context/body-stripped.json || {
          echo "::warning::could not strip the PR description - leaving it as it is"
          exit 0
        }

        if [ "$(jq -r .stripped .review-context/body-stripped.json)" != "true" ]; then
          echo "PR description: no Claude Code advert"
          exit 0
        fi

        if ! jq '{body}' .review-context/body-stripped.json \
             | gh api "repos/${REPO}/pulls/${PR_NUMBER}" -X PATCH --input - >/dev/null ; then
          echo "::warning::could not edit the PR description - the description checks will report the advert instead"
          exit 0
        fi

        jq --slurpfile s .review-context/body-stripped.json '.body = $s[0].body' \
          .review-context/pr.json > .review-context/pr.json.new \
          && mv .review-context/pr.json.new .review-context/pr.json
        echo "::notice::removed the Claude Code advert from the PR description"

    # A human reviewer's judgment on this PR takes precedence permanently,
    # not just until the next push: once anyone who isn't a bot has approved
    # at any point in the PR's history, every later run skips the automated
    # review outright rather than re-litigating it. Skipping (not posting a
    # fresh approval) is what makes this work — the bot's own last review
    # stays whatever it already was, so it can't override the human
    # reviewer's still-active approval in the aggregate review decision.
    - name: Check for a prior human approval
      id: human_approval
      if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
      run: |
        set -euo pipefail
        found=$(jq -r '[.[] | select(.user.type != "Bot" and .state == "APPROVED")] | length > 0' .review-context/reviews.json)
        echo "found=${found}" >> "$GITHUB_OUTPUT"
        if [ "$found" = "true" ]; then
          echo "::notice::a human reviewer has already approved this PR — skipping the automated review"
        fi

    # A pins-only PR from a dependency bot is approved here directly rather
    # than by the model. Detection is a heuristic (author + branch prefix,
    # plus a PR-description marker for Renovate), not proof - see
    # ghul-lang/ghul#2006. Any file outside the allowlist below falls through
    # to the full review as normal.
    - name: Check for a mechanical dependency-only change
      id: dependency_only
      if: github.event_name == 'pull_request' && steps.human_approval.outputs.found != 'true' && inputs.dependency-fast-path
      run: |
        set -euo pipefail

        author=$(jq -r '.author.login' .review-context/pr.json)
        head_ref=$(jq -r '.headRefName' .review-context/pr.json)
        body=$(jq -r '.body' .review-context/pr.json)

        # gh's --json author reports a GitHub App actor's login with an
        # "app/" prefix (e.g. "app/ghul-coder"), not the "ghul-coder[bot]"
        # form the REST API and the PR/commit UI use.
        #
        # Renovate runs as this fleet's own App, which also opens ordinary
        # pull requests, so the branch prefix and the description marker are
        # what separate a Renovate run from the rest of that App's work.
        # Dependabot is GitHub's own App and opens nothing else, so its
        # author and branch prefix identify it on their own.
        looks_like_dependency_bot=false
        if [ "$author" = "app/ghul-coder" ] \
          && [[ "$head_ref" == renovate/* ]] \
          && grep -q '<!--renovate-debug:' <<< "$body"; then
          looks_like_dependency_bot=true
        elif [ "$author" = "app/dependabot" ] \
          && [[ "$head_ref" == dependabot/* ]]; then
          looks_like_dependency_bot=true
        fi

        # Version-pin files only. Workflow YAML is deliberately excluded -
        # CODEOWNERS coverage on .github/workflows/ isn't confirmed on every
        # repo this fleet reviews, so an action bump still gets a full review.
        pin_pattern='(^|/)(Directory\.Packages\.props|Directory\.Build\.props|\.config/dotnet-tools\.json|package\.json|package-lock\.json|npm-shrinkwrap\.json|Dockerfile)$|\.(csproj|ghulproj)$'

        only_pins=true
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          if ! [[ "$f" =~ $pin_pattern ]]; then
            only_pins=false
          fi
        done < <(jq -r '.files[].path' .review-context/pr.json)

        # A pin file can carry anything a dependency bot did not write, so
        # the file names are not enough: every changed line has to be a
        # changed line of the same shape, differing only in version numbers
        # and content hashes. An added or removed line - a new dependency, a
        # new RUN step - sends the change to the full review.
        versions_only=true
        if ! perl -ne '
            sub norm {
                my $s = shift;
                $s =~ s/sha(?:1|256|384|512)[-:][0-9A-Za-z+\/=]+/H/g;
                $s =~ s/\b[0-9a-f]{40,}\b/H/g;
                $s =~ s/\d+(?:\.\d+)+(?:[-+][0-9A-Za-z.-]+)?/V/g;
                return $s;
            }
            sub flush {
                if (join("\0", @r) ne join("\0", @a)) {
                    print "::notice::$file changes more than versions\n";
                    $bad = 1;
                }
                @r = (); @a = ();
            }
            if (/^diff --git a\/(\S+)/) { flush(); $file = $1; next }
            next if /^(?:---|\+\+\+) /;
            if (/^-(.*)/s) { push @r, norm($1); next }
            if (/^\+(.*)/s) { push @a, norm($1); next }
            flush();
            END { flush(); exit($bad ? 1 : 0) }
        ' .review-context/diff.patch; then
          versions_only=false
        fi

        if [ "$looks_like_dependency_bot" = "true" ] && [ "$only_pins" = "true" ] && [ "$versions_only" = "true" ]; then
          echo "match=true" >> "$GITHUB_OUTPUT"
          echo "::notice::mechanical dependency-only bot PR (pins/version files only) — approving without a full review"
        else
          echo "match=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Approve a mechanical dependency-only change
      if: steps.dependency_only.outputs.match == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        set -euo pipefail
        gh pr review "${{ env.PR_NUMBER }}" --repo "${{ github.repository }}" \
          --approve --body "**Not reviewed** - mechanical dependency-only update: versions and hashes changed in version-pin files only, from a dependency bot, so the model was not run.

        CI is the gate for whether the bump itself is safe. A source-touching commit on this pull request routes back through the full review automatically."

    # A push that leaves the reviewed content identical - a rebase, a merge
    # from the base branch, a force-push that only rewrites history - gets no
    # second review. The previous review already covers this content, and on
    # a repository whose branch protection does not dismiss stale reviews
    # (the usual setting for this fleet) that review is still the live one:
    # an approval still counts towards the merge, and outstanding findings
    # still block. Re-reviewing would spend a full run to re-derive an answer
    # that is already posted.
    #
    # The fingerprint is taken over the diff with its hunk headers and blob
    # hashes normalised out, so a rebase that shifts line numbers without
    # changing the change still matches. It is carried in an HTML comment in
    # the review body, which GitHub does not render, so the marker is
    # invisible to readers but readable from the reviews API.
    #
    # Fails open in every uncertain direction: a review whose body carries no
    # marker (an older run, or a model that dropped it) simply does not
    # match, and the review proceeds.
    - name: Check whether the reviewed content has changed
      id: content_changed
      if: github.event_name == 'pull_request' && steps.human_approval.outputs.found != 'true' && steps.dependency_only.outputs.match != 'true'
      run: |
        set -euo pipefail

        # Line numbers move under a rebase without the change differing, and
        # so do the blob hashes on the index line. Neither is part of what a
        # reviewer read, so neither belongs in the fingerprint.
        #
        # The title and body are in it because they are reviewed too: the
        # description ships as the squash-merge commit message, and a finding
        # about it is cleared by editing the description rather than by
        # touching the diff. Over the diff alone, that edit would leave the
        # fingerprint unchanged, the standing verdict would be re-posted, and
        # a description finding could never be cleared at all.
        {
          sed -E 's/^@@ .* @@.*$/@@/; /^index [0-9a-f]+\.\.[0-9a-f]+/d' .review-context/diff.patch
          jq -r '.title, (.body // "")' .review-context/pr.json
        } > .review-context/fingerprint-input
        fingerprint=$(sha256sum < .review-context/fingerprint-input | cut -d' ' -f1)
        echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

        # The newest live bot review carrying this fingerprint, and what it
        # decided. Either verdict counts: both are a review of this exact
        # content. A dismissed review is not live - dismissal withdraws the
        # verdict, so a rerun after one re-reviews this content instead of
        # re-posting what was withdrawn.
        previous=$(jq -r --arg m "review-fingerprint: ${fingerprint}" \
          'last(.[] | select(.user.type == "Bot" and .state != "DISMISSED" and (.body // "" | contains($m))) | .state) // ""' \
          .review-context/reviews.json)

        if [ -n "$previous" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "previous_state=${previous}" >> "$GITHUB_OUTPUT"
          echo "::notice::the reviewed content is unchanged since the last review (fingerprint ${fingerprint:0:12}, ${previous}) - re-posting that verdict without running the model"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    # The mechanical description conventions, checked by grep rather than by
    # the model. They are cheap, they are unambiguous, and across a sample of
    # one repo's pull requests the description was the single most common
    # thing raised in a *second or later* review round - each of those costing
    # the author a full CI cycle to fix.
    #
    # The findings are seeded into review.json rather than posted on their
    # own, so they ride out with whatever the model finds in the diff and the
    # author fixes both together. Posting them alone, without running the
    # model, would cost the same round it saves: the diff would still be
    # unreviewed, and the code findings would arrive a cycle later.
    #
    # The description ships as the squash-merge commit message and the
    # changelog entry, which is why it is worth gating at all.
    - name: Check the PR description
      id: description
      # dependency_only and content_changed never run on a manual dispatch,
      # so their guards pass vacuously there and the description is checked
      # in full.
      if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.human_approval.outputs.found != 'true' && steps.dependency_only.outputs.match != 'true' && steps.content_changed.outputs.skip != 'true'
      env:
        REQUIRE_SECTION: ${{ inputs.require-description-section }}
      run: |
        set -uo pipefail

        # The description reaches the checks through a file rather than being
        # interpolated into this script, so one containing shell
        # metacharacters is data. (An expression written out in a comment here
        # would still be expanded - the whole block is expanded before any of
        # it is shell - so this says it in words.)
        jq -r '.body // ""'  .review-context/pr.json > body.txt
        jq -r '.title // ""' .review-context/pr.json > title.txt

        : > .review-context/description-findings.txt

        report() {
          printf '%s\n' "$1" >> .review-context/description-findings.txt
          printf '::warning title=PR description::%s\n' "$1"
        }

        # GitHub runs this under 'bash -e', so a function ending in a && list
        # returns non-zero when the left side does not match - and errexit
        # would then end the run at the first check that found nothing, which
        # is the common case. The explicit return is what keeps a non-match a
        # non-finding.
        check() {
          grep -qiE "$1" body.txt && report "$2"
          return 0
        }

        check '^##+ *(summary|test plan|testing)' \
          "'## Summary' / '## Test plan' heading - the description is the summary, so the heading says nothing"
        check '^co-authored-by:' \
          "Co-authored-by trailer in the body - squash-merge appends a deduped one, so this ships twice"
        check '(pass(es|ed)? locally|all [0-9]+ .*tests? pass|bootstrap green|tested locally)' \
          "local test results in the body - CI is the proof of what shipped, and the claim is unverifiable in the commit log"
        check '(phase [0-9]|stage [0-9]|predecessor branch|option [ABC]\b|follow-up PR [0-9])' \
          "internal label in the body - meaningless to someone reading the commit log later"
        check '#(minor|major)\b' \
          "#minor/#major marker is a no-op - raise the VERSION file instead"

        # The advert is normally stripped before this step runs; these catch
        # what the strip left, a session link inside a sentence, or a body the
        # strip could not edit.
        grep -qF '🤖 Generated with' body.txt && report "Claude Code footer in the body"
        grep -qE 'claude\.ai/code/session_' body.txt && report "session URL in the body"
        grep -qE '(docs/claude|PENDING-PRS|memory file|CLAUDE\.md)' body.txt && report "private reference in the body"
        grep -qE '/home/[a-z0-9_-]+/|worktrees/' body.txt && report "local filesystem path in the body"

        # The title is repeated on the squash-merge subject line, so a body
        # opening by restating it ships the same sentence twice.
        first_line=$(head -1 body.txt | sed -E 's/^#+ *//; s/[[:space:]]+$//')
        if [ -n "$first_line" ] && [ "$first_line" = "$(cat title.txt)" ]; then
          report "the first body line repeats the title - squash-merge already puts the title on the subject line"
        fi

        # A label wearing markdown - '**Enhancements:**', '## Enhancements' - is
        # not a missing section, and reporting it as one sends the author looking
        # for something that is already there. Section labels are plain text: the
        # description ships as the commit message, where the markup is noise.
        # '|| true' is load-bearing, not defensive. This step runs under the
        # runner's 'bash -e' and sets pipefail, so the grep finding nothing -
        # which is what a well-formed description looks like - would fail the
        # pipeline and end the step before any check reported anything.
        marked_up=$(grep -oE '^([[:space:]]*[*_#>]+[[:space:]]*)+(Enhancements|Bugs fixed|Technical):?[*_[:space:]]*$' body.txt \
          | head -3 | sed -E "s/^[[:space:]]*|[[:space:]]*$//g; s/^/'/; s/$/'/" | tr '\n' ',' | sed 's/,$//; s/,/, /g' || true)

        if [ -n "$marked_up" ]; then
          report "section label(s) carrying markdown: ${marked_up} - the labels are plain text, so write 'Enhancements:' rather than marking it up as a heading or in bold"
        fi

        if [ "$REQUIRE_SECTION" = "true" ] \
          && [ -z "$marked_up" ] \
          && ! grep -qE '^(Enhancements|Bugs fixed|Technical):' body.txt ; then
          report "no 'Enhancements:' / 'Bugs fixed:' / 'Technical:' section - at least one is required"
        fi

        count=$(wc -l < .review-context/description-findings.txt)
        echo "count=${count}" >> "$GITHUB_OUTPUT"

        if [ "$count" -eq 0 ]; then
          echo "PR description: clean"
          exit 0
        fi

        # Seeded as the review the model will extend and post. It is written
        # here rather than described in the prompt so that the findings exist
        # on disk before the model starts: if the run is killed, the salvage
        # step posts them even though the model never reached anything.
        jq -Rs --arg n "$count" \
          '{event: "REQUEST_CHANGES",
            body: ("**" + $n + " finding(s) on the PR description**, from the mechanical checks. The description becomes the squash-merge commit message and the changelog entry, so it ships permanently.\n\n"
                   + (split("\n") | map(select(length > 0)) | map("- " + .) | join("\n"))),
            comments: []}' \
          < .review-context/description-findings.txt > review.json

        printf '### PR description\n\n' >> "$GITHUB_STEP_SUMMARY"
        sed 's/^/- /' .review-context/description-findings.txt >> "$GITHUB_STEP_SUMMARY"
        echo "PR description: ${count} finding(s), seeded into review.json"

    # Re-stating the standing verdict rather than staying silent, because a
    # skipped review must not leave the pull request stuck. Where branch
    # protection dismisses stale reviews, or requires the approval to be of
    # the latest push, the earlier review stops counting the moment a commit
    # lands - and a silent skip would then block a pull request nobody is
    # going to review again. Re-posting removes the dependency on those
    # settings entirely: the verdict on this content is always the live one,
    # whatever the repository is configured to do with older reviews.
    #
    # A CHANGES_REQUESTED is re-posted as a body-only review. The original
    # inline findings are still on the pull request and still readable, and
    # posting them again would duplicate every one of them on each rebase.
    #
    # This costs one API call and no model time, which is the whole point:
    # the expensive part was never the posting.
    - name: Re-post the standing review
      if: steps.content_changed.outputs.skip == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        PR_NUMBER: ${{ env.PR_NUMBER }}
        REPO: ${{ github.repository }}
        PREVIOUS_STATE: ${{ steps.content_changed.outputs.previous_state }}
        FINGERPRINT: ${{ steps.content_changed.outputs.fingerprint }}
      run: |
        set -euo pipefail

        marker="<!-- review-fingerprint: ${FINGERPRINT} -->"

        if [ "$PREVIOUS_STATE" = "APPROVED" ]; then
          body="**Not re-reviewed** - the diff is unchanged since the last review, so the model was not run and that approval stands.

        ${marker}"
          jq -n --arg b "$body" '{event: "APPROVE", body: $b}' > restate.json
        else
          body="**Not re-reviewed** - the diff is unchanged since the previous review, so the model was not run and its findings still stand. They are on that review, inline.

        ${marker}"
          jq -n --arg b "$body" '{event: "REQUEST_CHANGES", body: $b}' > restate.json
        fi

        gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" -X POST --input restate.json >/dev/null
        echo "::notice::re-posted the standing ${PREVIOUS_STATE} verdict"

    # Resolves the fleet-wide default provider/tier, then which credentials
    # and concrete model the rest of the job uses. Only the secret the
    # selected provider actually needs is read here, so an unconfigured
    # provider's empty secret never reaches an env var at all. Written via
    # $GITHUB_ENV rather than a step `env:` block, because a value produced
    # here has to reach later steps' real process environment (the claude CLI
    # itself reads ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN from there) - the
    # static `${{ env.* }}` expression context does not see anything written
    # to $GITHUB_ENV at runtime, only values declared in a workflow/job/step
    # `env:` key.
    - name: Resolve provider, tier and credentials
      id: provider
      if: steps.human_approval.outputs.found != 'true' && steps.dependency_only.outputs.match != 'true' && steps.content_changed.outputs.skip != 'true'
      env:
        CLAUDE_OAUTH_TOKEN: ${{ secrets.claude-oauth-token }}
        QWEN_AUTH_TOKEN: ${{ secrets.qwen-auth-token }}
        OPENROUTER_AUTH_TOKEN: ${{ secrets.openrouter-auth-token }}
        ZAI_AUTH_TOKEN: ${{ secrets.zai-auth-token }}
      run: |
        set -euo pipefail

        # Fleet-wide defaults, fetched fresh every run. Unauthenticated raw
        # fetch works because this repo is public - editing fleet.json on
        # main and pushing is the single switch that moves every consumer
        # repo's next review run, with no per-repo commit or variable.
        FLEET_JSON=$(curl -fsSL --max-time 10 https://raw.githubusercontent.com/ghul-lang/ghul-code-review/main/fleet.json 2>/dev/null || true)
        if [ -z "$FLEET_JSON" ] || ! echo "$FLEET_JSON" | jq -e . >/dev/null 2>&1; then
          echo "::warning::could not fetch or parse fleet.json - falling back to this workflow's own built-in defaults"
          FLEET_JSON='{}'
        fi
        FLEET_PROVIDER=$(echo "$FLEET_JSON" | jq -r '.provider // empty')
        FLEET_TIER=$(echo "$FLEET_JSON" | jq -r '.tier // empty')

        PROVIDER="${PROVIDER_OVERRIDE:-${FLEET_PROVIDER:-anthropic}}"
        TIER="${TIER_OVERRIDE:-${FLEET_TIER:-medium}}"

        # Used only when fleet.json doesn't cover [provider][tier] - a fetch
        # failure, or a tier name fleet.json hasn't been given a model for.
        fallback_model() {
          case "$1:$2" in
            anthropic:high)    echo claude-opus-5 ;;
            anthropic:medium)  echo claude-sonnet-5 ;;
            anthropic:low)     echo claude-haiku-4-5 ;;
            qwen:high)         echo qwen3.8-max ;;
            qwen:medium)       echo qwen3.7-max ;;
            qwen:low)          echo qwen3.6-flash ;;
            openrouter:high)   echo z-ai/glm-5.3 ;;
            openrouter:medium) echo z-ai/glm-5.3-flash ;;
            openrouter:low)    echo z-ai/glm-5.3-flash ;;
            zai:high)          echo glm-5.3 ;;
            zai:medium)        echo glm-5.3-flash ;;
            zai:low)           echo glm-5.3-flash ;;
            *) echo "" ;;
          esac
        }

        if [ -n "$MODEL_OVERRIDE" ]; then
          MODEL="$MODEL_OVERRIDE"
        else
          MODEL=$(echo "$FLEET_JSON" | jq -r --arg p "$PROVIDER" --arg t "$TIER" '.models[$p][$t] // empty')
          [ -n "$MODEL" ] || MODEL=$(fallback_model "$PROVIDER" "$TIER")
          if [ -z "$MODEL" ]; then
            echo "::error::no model resolvable for provider=$PROVIDER tier=$TIER - not in fleet.json and no built-in fallback for this tier; use tier 'high'/'medium'/'low' or set 'model' explicitly"
            exit 1
          fi
        fi

        case "$PROVIDER" in
          anthropic)
            [ -n "$CLAUDE_OAUTH_TOKEN" ] || { echo "::error::provider resolved to 'anthropic' but the claude-oauth-token secret is empty"; exit 1; }
            echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_OAUTH_TOKEN" >> "$GITHUB_ENV"
            ;;
          qwen)
            [ -n "$QWEN_AUTH_TOKEN" ] || { echo "::error::provider resolved to 'qwen' but the qwen-auth-token secret is empty"; exit 1; }
            echo "ANTHROPIC_AUTH_TOKEN=$QWEN_AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic" >> "$GITHUB_ENV"
            ;;
          openrouter)
            [ -n "$OPENROUTER_AUTH_TOKEN" ] || { echo "::error::provider resolved to 'openrouter' but the openrouter-auth-token secret is empty"; exit 1; }
            echo "ANTHROPIC_AUTH_TOKEN=$OPENROUTER_AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api" >> "$GITHUB_ENV"
            ;;
          zai)
            [ -n "$ZAI_AUTH_TOKEN" ] || { echo "::error::provider resolved to 'zai' but the zai-auth-token secret is empty"; exit 1; }
            echo "ANTHROPIC_AUTH_TOKEN=$ZAI_AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic" >> "$GITHUB_ENV"
            # Z.AI's Coding Plan can queue a request far longer than the CLI's
            # default timeout; without raising it a queued review times out and
            # loses the turn before the model ever responds.
            echo "API_TIMEOUT_MS=3000000" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::unknown provider '$PROVIDER' - expected anthropic, qwen, openrouter or zai"
            exit 1
            ;;
        esac
        echo "PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
        echo "TIER=$TIER" >> "$GITHUB_ENV"
        echo "MODEL=$MODEL" >> "$GITHUB_ENV"
        echo "::notice::code review provider=$PROVIDER tier=$TIER model=$MODEL"

    - name: Install claude CLI
      if: steps.human_approval.outputs.found != 'true' && steps.dependency_only.outputs.match != 'true' && steps.content_changed.outputs.skip != 'true'
      run: |
        curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run review with live progress and heartbeat watchdog
      if: steps.human_approval.outputs.found != 'true' && steps.dependency_only.outputs.match != 'true' && steps.content_changed.outputs.skip != 'true'
      shell: bash
      env:
        # If the caller passed App credentials, post under the App's installation identity.
        # Otherwise fall back to the default GITHUB_TOKEN (github-actions[bot]).
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        # Carried into the review body so a later run can tell that the
        # content it is looking at has already been reviewed.
        CONTENT_FINGERPRINT: ${{ steps.content_changed.outputs.fingerprint }}
        MAINTAINER_REVIEW: ${{ inputs.maintainer-review }}
      run: |
        set -uo pipefail

        # Each stream-json event -> one summary line in the live job log.
        # Raw JSON still goes to the watchdog's file so it can detect silence.
        progress_filter() {
          jq -r --unbuffered '
            def trunc($n): if (.|tostring|length) > $n then (.|tostring)[0:$n] + "…" else (.|tostring) end;
            def squash: gsub("\\s+"; " ");
            if .type == "system" and .subtype == "init" then
              "[init] model=\(.model // "?") tools=\((.tools // []) | length)"
            elif .type == "system" and .subtype == "thinking_tokens" then
              "[thinking_raw] \(.estimated_tokens // 0)"
            elif .type == "system" then
              "[system/\(.subtype // "?")] " + ((. | del(.type, .subtype, .session_id, .uuid, .parent_tool_use_id) | tostring) | gsub("\\s+"; " ") | .[0:180])
            elif .type == "assistant" then
              (.message.content // [] | map(
                if .type == "text" then
                  "[text] " + (.text | squash | trunc(180))
                elif .type == "tool_use" then
                  "[tool] \(.name) " + ((.input // {} | tostring) | squash | trunc(180))
                else "[\(.type)]" end
              ) | .[])
            elif .type == "user" then
              (.message.content // [] | map(
                if .type == "tool_result" then
                  (.content as $c
                   | (if ($c | type) == "array" then ($c | map(.text // "") | join(" "))
                      elif ($c | type) == "string" then $c
                      else ($c | tostring) end)
                   | squash | trunc(180)
                   | "[result] " + .)
                else "[\(.type)]" end
              ) | .[])
            elif .type == "result" then
              "[done/\(.subtype)] turns=\(.num_turns // "?") cost_usd=\(.total_cost_usd // "?") duration_ms=\(.duration_ms // "?")"
            else
              "[\(.type // "?")]"
            end
          ' 2>/dev/null || true
        }

        LOG_DIR="${RUNNER_TEMP}/review-logs"
        mkdir -p "$LOG_DIR"

        # One row per attempt in the job summary, so the shape of a run is readable
        # without downloading anything. The stream is JSONL with stderr interleaved,
        # so every line is parsed defensively and unparseable ones are dropped.
        scorecard() {
          local attempt=$1 f=$2 rc=$3 killed=$4
          local j
          j=$(jq -R 'fromjson? // empty' < "$f" 2>/dev/null | jq -s '.' 2>/dev/null) || j='[]'
          [ -n "$j" ] || j='[]'

          local q='[.[]|select(.type=="assistant")|.message.content[]?|select(.type=="tool_use")]'
          local tools names fanout refused posted cost dur turns
          tools=$(echo "$j"  | jq -r "$q|length")
          names=$(echo "$j"  | jq -r "$q|map(.name)|group_by(.)|map(\"\(.[0])×\(length)\")|join(\", \")")
          fanout=$(echo "$j" | jq -r "$q|map(select(.name|test(\"^(Agent|Workflow|Task)\$\")))|length")
          posted=$(echo "$j" | jq -r "$q|map(select((.input|tostring)|test(\"/reviews|pr review\")))|length")
          refused=$(echo "$j" | jq -r '[.[]|select(.type=="user")|.message.content[]?|select(.type=="tool_result")|(.content|tostring)|select(test("requires approval|Review dynamic workflow"))]|length')
          cost=$(echo "$j"   | jq -r '[.[]|select(.type=="result")]|last|.total_cost_usd // "?"')
          dur=$(echo "$j"    | jq -r '[.[]|select(.type=="result")]|last|.duration_ms // 0')
          turns=$(echo "$j"  | jq -r '[.[]|select(.type=="result")]|last|.num_turns // "?"')

          if [ "$attempt" = "1" ]; then
            printf '### Review run (provider=%s tier=%s model=%s)\n\n' "$PROVIDER" "$TIER" "$MODEL"
            printf '| attempt | outcome | duration | turns | tool calls | fan-out | refused | posted | cost |\n'
            printf '|---|---|---|---|---|---|---|---|---|\n'
          fi
          printf '| %s | rc=%s%s | %ss | %s | %s | %s | %s | %s | $%s |\n' \
            "$attempt" "$rc" "$([ "$killed" = "true" ] && echo ' watchdog-killed')" \
            "$(( dur / 1000 ))" "$turns" "$tools" "$fanout" "$refused" "$posted" "$cost"
          [ -n "$names" ] && printf '\n%s\n' "$names"
        }

        # Elapsed time is not observable from inside the run, and asking the model to
        # measure it against a wall-clock deadline does not work: the last run that
        # overran did check the clock, noticed it was over budget, and carried on. So
        # the remaining time is pushed instead of pulled. A PostToolUse hook fires on
        # every tool call and returns the time left as a duration, which costs the model
        # nothing to remember and nothing to compute, and the wording escalates on its
        # own as the budget runs down.
        DEADLINE_EPOCH=$(( $(date +%s) + POST_AFTER_MIN * 60 ))
        HOOK_DIR="${RUNNER_TEMP}/review-budget"
        mkdir -p "$HOOK_DIR"
        echo "$DEADLINE_EPOCH" > "$HOOK_DIR/deadline"

        cat > "$HOOK_DIR/budget.sh" <<'BUDGET_HOOK'
        #!/usr/bin/env bash
        # PostToolUse hook: report the remaining budget as a duration.
        # additionalContext is the only channel that reaches the model on an exit-0
        # hook; plain stdout is swallowed.
        set -euo pipefail
        cat >/dev/null || true
        deadline=$(cat "$1" 2>/dev/null || echo 0)
        left=$(( deadline - $(date +%s) ))

        if [ "$left" -gt 120 ]; then
          text="Time budget: $(( left / 60 ))m $(( left % 60 ))s remaining."
        elif [ "$left" -gt 30 ]; then
          text="Time budget: $(( left / 60 ))m $(( left % 60 ))s remaining. Stop investigating and start writing up. Put what you already have into review.json now; further reading is no longer affordable."
        elif [ "$left" -gt 0 ]; then
          text="Time budget: ${left}s remaining. Post now. Write review.json with the findings you have and POST it with gh api. This run is killed shortly and anything unposted is lost."
        else
          text="Time budget: EXPIRED. Post immediately — write review.json and POST it with gh api on this turn. Do not read anything further."
        fi

        printf '{"hookSpecificOutput":{"hookEventName":"PostToolUse","additionalContext":%s}}\n' \
          "$(printf '%s' "$text" | jq -Rs .)"
        BUDGET_HOOK
        chmod +x "$HOOK_DIR/budget.sh"

        cat > "$HOOK_DIR/settings.json" <<SETTINGS
        {
          "hooks": {
            "PostToolUse": [
              { "matcher": "*", "hooks": [ { "type": "command", "command": "${HOOK_DIR}/budget.sh ${HOOK_DIR}/deadline" } ] }
            ]
          }
        }
        SETTINGS

        # Append a small note about sandbox/CLI quirks and the canonical posting command
        # so each caller doesn't repeat them. The model has historically picked the wrong
        # gh subcommand (issue comment vs. formal PR review) without explicit instruction.
        FULL_PROMPT="$PROMPT

        Time budget:
        - You have ${POST_AFTER_MIN} minutes to post this review. You do not have to track that yourself and you must not try: after every tool call you are told how much of it is left, as a duration. Do not run 'date' to work it out — the answer is already in front of you, and the one thing that budget line asks of you is that you act on it.
        - When it tells you to stop investigating, stop investigating. That instruction arrives while you still have time to write up, and it is the whole point of the budget: it is not a status report to note and read past. A run that reads one more file after being told to stop is the run that posts nothing.
        - The budget is a working deadline, not the emergency stop. The run is killed shortly after it expires, and a killed run posts nothing at all: no review, a failed check, and a PR blocked on work nobody can read. A shallower review that gets posted beats a deeper one that does not.
        - Depth is yours to spend against that budget. Read what the diff makes you want to read, then stop and post. If the budget is nearly gone, post what you have — a review covering the changes you did read is a complete review, not a partial one.
        - Do not delegate to subagents or parallel workers. They are disabled: they multiply token cost, and coordinating them is what exhausts the budget before anything reaches the PR. One reviewer, reading directly.

        Tools:
        - Read, Grep and Glob are how you read the diff and the tree. Read takes offset and limit, so a large file is a couple of targeted calls rather than a series of overlapping shell slices.
        - Bash is restricted to 'gh', 'date', 'git log' and 'wc'. Anything else is refused, and nobody is present to approve it: a refused command fails outright, and the attempt costs budget whether or not it runs.
        - So do not probe for what the shell will accept. If a command is refused, do not retry it, rephrase it, or look for an equivalent that might get through — reach the same conclusion with Read, Grep and Glob, or decide without it and say what you could not check.

        Runtime notes:
        - PR context is pre-fetched in ./.review-context/ — use Read (or Grep) on these files instead of refetching with 'gh pr diff' / 'gh pr view' / 'gh api':
            .review-context/diff.patch          — full unified diff
            .review-context/pr.json             — PR metadata (title, body, author, base/head refs, file counts, commits, labels)
            .review-context/comments.json       — top-level issue comments on the PR
            .review-context/reviews.json        — prior PR reviews (use to acknowledge already-resolved findings, avoid duplicates)
            .review-context/review-comments.json — prior inline review comments
            .review-context/since-last-review.patch — present only when there is a previous review and the branch has moved since: the diff from the commit that review was posted against to the current head, which is the author's response to it. Read it to locate what changed rather than re-deriving it from the commit list. It is a pointer into diff.patch, not a substitute — diff.patch is what you are reviewing and what your verdict covers, since a later push can break code an earlier round read and passed.
        - Post exactly one formal PR Review per run. The event is a binary choice on whether you are raising anything at all:
            - Nothing to raise, and no pre-seeded review.json -> approve, with a body that opens '**Reviewed** - no findings.' so that a full review is distinguishable at a glance from the runs that approve without starting the model at all. Approval is the merge signal (branch protection can require an approving review of the latest changes and auto-merge waits on it), so always post it explicitly rather than staying silent — a skipped review is indistinguishable from a stuck bot.
            - One or more findings, of any severity -> write a JSON file (e.g. review.json) and POST it via the reviews endpoint with event REQUEST_CHANGES:
                gh api repos/<OWNER>/<REPO>/pulls/<PR-number>/reviews -X POST --input review.json
              The JSON shape:
                {
                  \"event\": \"REQUEST_CHANGES\",
                  \"body\": \"<optional cross-cutting summary; can be empty>\",
                  \"comments\": [
                    {\"path\": \"<repo-relative file>\", \"line\": <new-side line number>, \"body\": \"<finding>\"},
                    ...
                  ]
                }
              One finding per 'comments[]' entry, anchored to the specific line; use 'body' only for cross-cutting commentary that doesn't belong on one line. The default 'side' is RIGHT (the new version of the file); add \"side\": \"LEFT\" only when anchoring to a deletion.
              Every 'comments[]' entry must anchor to a line that appears in this PR's diff. The endpoint rejects the whole POST with a 422 if any single entry falls outside the diff hunks, discarding every other finding with it — so a finding about code the diff doesn't touch goes in 'body', not on a line.
        - Never use event COMMENT (it does not satisfy branch protection, so the PR sits stuck) and never event APPROVE carrying inline findings (auto-merge can land the PR before the author reads what you flagged). If a finding is worth posting it is REQUEST_CHANGES; if it is not, stay silent and approve. A caveat you would attach to an approval is itself a finding — drop the approval and raise it.
        - Do NOT use 'gh pr comment' — that creates an issue comment, not a review.
        - The working directory (e.g. /home/runner/work/<repo>/<repo>) is writeable — Write the JSON there. /tmp is NOT writeable.
        - JSON 'body' fields can contain markdown (including '# headings') — the '#'-at-line-start guard only applies to command-line --body arguments, not to file contents POSTed via --input.
        - review.json may already exist when you start. If it does, it holds findings from the mechanical description checks, which have already run - they are correct, they are not yours to re-judge, and they must survive into whatever you post. Add your own findings to its 'comments' array, leave its 'body' text in place (append to it if you have cross-cutting commentary of your own), and keep the event REQUEST_CHANGES. Do NOT approve when that file exists, even if the diff itself is clean: the description ships as the commit message, and approving would ship it uncorrected.
        - Do not spend a finding of your own on anything those checks already cover - headings, footers, session URLs, trailers, local test results, internal labels, private references, a first line repeating the title, a missing section, an over-long intro. What is left for you is the part a grep cannot see: whether the description describes what the diff actually does, and whether an intro is written for the right reader.
        - Name the file 'review.json', in the working directory, and write it as soon as you have your first surviving finding — then rewrite it as each further one survives. If this run is killed before it posts (watchdog, job timeout, a stalled provider), whatever is in that file at that moment is posted on your behalf as a partial review; anything you were holding in your head is lost. Writing it once at the end throws that away for nothing.
        - Put this marker on its own line at the end of the review 'body', in both the approve and the request-changes case, with the value exactly as given:
            <!-- review-fingerprint: ${CONTENT_FINGERPRINT} -->
          It records which content this review covers, so a later run over an identical diff (a rebase, a merge from the base branch) can see the content is already reviewed and skip instead of re-deriving your answer. It is an HTML comment, so it does not render. For the approve case that means passing '--body' the '**Reviewed** - no findings.' line followed by the marker line.

        What you are reading vs. what CI gates:
        - You run in parallel with CI, not after it, so its jobs can still be in flight. Whether the diff builds, compiles and passes tests is settled by CI and branch protection before anything merges — that is not your job. Trust the diff as written: do not try to mentally compile it, run tests, or verify reproducibility. Spend your attention on what the test suite cannot catch even when it passes.

        What to say:
        - Group inline findings by severity: prefix each with **Bug**, **Concern** or **Nit** so severity is scannable. Severity is a reading-order aid; it does not change whether you request changes.
        - Raise a finding only when it would change what a careful maintainer does. Not style preferences the codebase does not share, not speculative refactors, not restatements of what the diff plainly does, not hypotheticals without a concrete path. Silence on a low-confidence finding beats noise — the job is high-signal feedback, not exhaustive enumeration.
        - Every finding blocks the PR, so apply that test before writing it down: is this worth holding the merge for until someone fixes it? If yes, raise it. If no, drop it entirely. There is no third outcome — nobody comes back to fix something the review mentioned in passing and merged anyway, so a finding you would not block on is one you should not have spent the words on.
        - Do not soft-pedal. If a finding is worth saying, say it as a finding; if it is not, stay silent. Closing notes like 'non-blocking, but…', 'minor nit (no action)' or 'consider…' do not fit this workflow, because by the time the author reads them the PR can already have merged.
        - The categories below are what counts as a finding when you meet one, not a checklist to work through or a quota to fill. Read the diff, follow what it makes you curious about, and report what you actually found. A category you had no reason to look into is not a gap in the review, and hunting for something to say under each heading produces exactly the low-value findings the previous points rule out.
        - Docs-only and workflow-only changes are held to the same bar as code. They ship as permanently as code does, and several repos generate their release notes from the squash-merge message. The same bar is not the same amount of work: a small prose or configuration change usually warrants nothing, and reaching that conclusion quickly is the bar being applied, not skipped.
        - A routine mechanical change — a dependency or tool-version bump, a lockfile update, a generated-file refresh — is read for what makes it non-routine: a major-version jump, a change that needs a matching update elsewhere, an edit smuggled in alongside the mechanical one. Finding none of those, approve and move on rather than looking for something to say.
        - An approval with no findings is a good outcome and a common one. It is the review working, not the review giving up, and it is what lets a clean PR merge. Do not treat an empty findings list as a sign you have not looked hard enough.

        Scoring what you found:
        - Before posting, score every candidate finding from 0 to 100 for how confident you are that it is real and worth acting on, against this scale:
            0   — a false positive that does not stand up to light scrutiny, or a pre-existing issue this diff did not introduce.
            25  — it might be real, but you could not verify it; or it is stylistic and not something this repo's own rules call out.
            50  — verified real, but a nitpick, or rare enough in practice not to matter. Unimportant relative to the rest of the diff.
            75  — you checked it twice and it will be hit in practice; the approach in the diff is insufficient, or a rule this repo states explicitly names it.
            100 — confirmed, will happen routinely, and the evidence in front of you directly demonstrates it.
        - Post only the findings that score 80 or above. Drop the rest entirely — do not mention them in the body, do not soften them into an aside. If nothing scores 80 or above, approve.
        - Score honestly rather than generously. A finding you talked yourself into is a round trip that costs the author a full CI cycle and returns nothing, and the scale exists to make that a decision rather than a reflex.

        What is not a finding, however true:
        - A pre-existing issue the diff did not introduce, and a real issue on a line the diff does not touch. Both belong in an issue, not in a review that blocks this PR.
        - Anything a compiler, type checker, linter or test would catch. Those run separately and gate the merge on their own; you do not need to check them and should not report them.
        - A pedantic nitpick a senior engineer would not raise in a review.
        - General code-quality observations — coverage, documentation, security posture in the abstract — unless a rule this repo states explicitly asks for them. In scope because a stated rule names it, not because it is generally good practice.
        - A change in behaviour that is plainly intentional, or that follows from the broader change the PR is making.
        - Something a comment or an existing PR comment already explains. Read the pre-fetched comments before concluding a choice is unjustified.

        Before you post, whatever else you found:
        - These three are cheap to check and are the ones most often left to a later round, which costs the author a full CI cycle to learn. Finding a problem in the code is not a reason to stop before them.
            - The PR description, against the conventions below and against what the diff actually does. A description that claims something the merged code will not do is a finding; it becomes the permanent commit message.
            - VERSION, against the bump table. It is one file.
            - The language or API reference this repo keeps, if the diff changes documented behaviour or adds something a user would look up. A grep, not a read.
        - Each is still subject to the 80 bar. Checking them is mandatory; reporting them is not.

        Source comment hygiene:
        - Comments must stand on their own for a reader who knows the repo but has none of the surrounding context — no PR thread, no issue, no private notes. The default position is no comment; comment where a competent reader would genuinely need context, such as a non-obvious invariant, a subtle ordering requirement, or a workaround whose reason is not visible from the code.
        - Flag comments that narrate what changed ('new in this branch', 'the fix', 'previously we…'), cite issues or PRs as explanation, justify the code against an earlier attempt, run excessively long, or read as one half of a conversation.

        PR description:
        - The description becomes the squash-merge commit message and the changelog entry, and ships permanently. Plain '-' bullets under 'Enhancements:' (things a consumer of this repo would notice), 'Bugs fixed:' (describe what was broken; reuse an issue's exact title with '(closes #NNNN)' where there is one), or 'Technical:' (internal changes). At least one section; any can be omitted.
        - A brief introductory paragraph before the first section is allowed, and is the right shape when the bullets are individually unremarkable but add up to something worth saying in one sentence. Two or three sentences at most. It is held to the same standard as everything else in the description: written for whoever reads the release notes or follows a regression back to this commit, never for the reviewer reading the pull request. So it records what changed and what it means, and it does not argue the case - no measurements offered as evidence the change was warranted, no pre-empting an objection only a reviewer would raise. That material belongs in a PR comment, where the reviewer sees it and it does not ship.
        - Flag an intro that fails that test, or that says in a paragraph what a bullet says in a line. Read it back with the pull request forgotten: if it only makes sense as one half of a conversation with a reviewer, it is a finding.
        - The mechanical conventions - headings, footers, session URLs, trailers, local test results, internal labels, private references - are checked by a separate grep-based job before you run, so do not spend a finding on them. What is left for you is the part a grep cannot see: whether the description describes what the diff actually does, and whether the intro is aimed at the right reader.

        Versioning:
        - Default is patch. A non-patch release is cut by raising the VERSION file in the PR; '#minor'/'#major' markers in the PR body are no-ops, so do not suggest adding them. A workflow_dispatch version input overrides outright, for emergencies.
        - Flag both directions: a breaking change going out without raising VERSION to a major, new public API without raising it to a minor, and a VERSION raise the change does not merit. What counts as breaking for this particular repo is in its review brief."

        if [ "$MAINTAINER_REVIEW" = "true" ]; then
          FULL_PROMPT="$FULL_PROMPT

        Changes that need the maintainer:
        - This repository's review brief names changes that need the maintainer's own review. For such a change, post REQUEST_CHANGES with one finding that names the area and says the change needs the maintainer's review. Do not approve it, however clean or routine it looks.
        - That finding is exempt from the 80 bar and from the rule that a routine mechanical change is approved. It is not a judgement that the change is wrong: it is the correct outcome, and branch protection then holds the pull request until the maintainer has read it.
        - When you are unsure whether a change touches one of those areas, treat it as touching it."
        fi

        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          echo "::group::Attempt ${attempt}/${MAX_ATTEMPTS}"
          # Kept for the artifact rather than discarded: the live log truncates every
          # event to 180 characters, so the reasoning behind a verdict survives nowhere
          # else. An approval is four characters and tells you nothing about what was
          # weighed to reach it.
          OUT="${LOG_DIR}/stream-attempt-${attempt}.json"

          # Each attempt gets the full budget: a retry born already expired would post
          # nothing but the escalation, which is worse than not retrying at all.
          DEADLINE_EPOCH=$(( $(date +%s) + POST_AFTER_MIN * 60 ))
          HARD_STOP_EPOCH=$(( DEADLINE_EPOCH + HARD_STOP_GRACE_S ))
          echo "$DEADLINE_EPOCH" > "$HOOK_DIR/deadline"

          claude \
            --model "$MODEL" \
            --verbose \
            --output-format stream-json \
            --add-dir "$PWD" \
            --allowedTools "$ALLOWED_TOOLS" \
            --disallowedTools "$DISALLOWED_TOOLS" \
            --settings "$HOOK_DIR/settings.json" \
            -p "$FULL_PROMPT" > "$OUT" 2>&1 &
          CLAUDE_PID=$!

          # Throttle thinking_tokens to one line per 1000-token milestone.
          # `stdbuf -oL` forces line-buffered stdout on awk — otherwise awk block-buffers
          # when its stdout is a pipe and the whole live log lands at job-exit.
          tail -n +1 -F "$OUT" --pid="$CLAUDE_PID" 2>/dev/null \
            | progress_filter \
            | stdbuf -oL awk 'BEGIN{m=1000} /^\[thinking_raw\] / { n=$2+0; if (n>=m) { print "[thinking] " n " tokens"; while(m<=n) m+=1000 } next } { print }' &
          TAIL_PID=$!

          LAST_SIZE=0
          IDLE=0
          WATCHDOG_KILLED=false
          DEADLINE_KILLED=false
          while kill -0 "$CLAUDE_PID" 2>/dev/null; do
            sleep 5

            # The deadline stop, distinct from the idle stop above it. The idle watchdog
            # only fires on silence, and a model that streams thinking tokens is never
            # silent, so before this existed nothing at all reacted to the clock between
            # the soft deadline and the job timeout. Whatever review.json holds at this
            # point is posted by the salvage step.
            if [ "$(date +%s)" -ge "$HARD_STOP_EPOCH" ]; then
              echo "::warning::budget exhausted (${POST_AFTER_MIN}m + ${HARD_STOP_GRACE_S}s grace) — killing PID ${CLAUDE_PID} and children"
              pkill -TERM -P "$CLAUDE_PID" 2>/dev/null || true
              kill -TERM "$CLAUDE_PID" 2>/dev/null || true
              sleep 2
              pkill -KILL -P "$CLAUDE_PID" 2>/dev/null || true
              kill -KILL "$CLAUDE_PID" 2>/dev/null || true
              WATCHDOG_KILLED=true
              DEADLINE_KILLED=true
              break
            fi

            SIZE=$(stat -c %s "$OUT" 2>/dev/null || echo 0)
            if [ "$SIZE" = "$LAST_SIZE" ]; then
              IDLE=$((IDLE + 5))
              if [ "$IDLE" -ge "$IDLE_TIMEOUT_S" ]; then
                echo "::warning::no claude stdout for ${IDLE_TIMEOUT_S}s — killing PID ${CLAUDE_PID} and children"
                pkill -TERM -P "$CLAUDE_PID" 2>/dev/null || true
                kill -TERM "$CLAUDE_PID" 2>/dev/null || true
                sleep 2
                pkill -KILL -P "$CLAUDE_PID" 2>/dev/null || true
                kill -KILL "$CLAUDE_PID" 2>/dev/null || true
                WATCHDOG_KILLED=true
                break
              fi
            else
              IDLE=0
              LAST_SIZE=$SIZE
            fi
          done
          wait "$CLAUDE_PID" 2>/dev/null; RC=$?
          wait "$TAIL_PID" 2>/dev/null || true
          echo "::endgroup::"

          # Written per attempt rather than once at the end: a run the runner kills at
          # timeout-minutes is the one whose numbers matter most, and it never reaches
          # the end.
          scorecard "$attempt" "$OUT" "$RC" "$WATCHDOG_KILLED" >> "$GITHUB_STEP_SUMMARY"

          if [ "$WATCHDOG_KILLED" = "false" ] && [ "$RC" -eq 0 ]; then
            echo "::notice::review completed on attempt ${attempt}"
            exit 0
          fi
          echo "::warning::attempt ${attempt} failed (rc=${RC}, watchdog_killed=${WATCHDOG_KILLED})"

          # A retry after a deadline kill would spend the same budget reading the same
          # diff and reach the same point, while the job timeout is not generous enough
          # for two full budgets - and a job killed at that timeout skips the salvage
          # step, losing the findings this attempt did write. Stop and let salvage run.
          if [ "$DEADLINE_KILLED" = "true" ]; then
            echo "::warning::budget exhausted — not retrying; salvaging whatever review.json holds"
            break
          fi
        done

        echo "::error::review not posted after ${MAX_ATTEMPTS} attempt(s) — failing the check so the diff is not merged unreviewed"
        exit 1

    # The model does the posting, so nothing upstream can force what it
    # posts. When the description checks found something, an approval is a
    # wrong answer that ships a bad commit message - and with auto-merge armed
    # it ships it immediately. This is the check that the seeded findings
    # actually reached the pull request, and the correction when they did not.
    #
    # success() rather than always(): a failed run is the salvage step's case,
    # and that step posts the seeded findings itself.
    - name: Make sure the description findings were posted
      if: success() && steps.description.outputs.count != '' && steps.description.outputs.count != '0'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        PR_NUMBER: ${{ env.PR_NUMBER }}
        REPO: ${{ github.repository }}
        COUNT: ${{ steps.description.outputs.count }}
      run: |
        set -uo pipefail

        latest=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
          --jq 'last(.[] | select(.user.type == "Bot") | .state) // ""')

        if [ "$latest" = "CHANGES_REQUESTED" ]; then
          echo "the posted review requests changes, as it should"
          exit 0
        fi

        echo "::warning::the review posted '${latest}' despite ${COUNT} description finding(s) - posting them separately"
        jq -Rs --arg n "$COUNT" \
          '{event: "REQUEST_CHANGES",
            body: ("**" + $n + " finding(s) on the PR description**, from the mechanical checks.\n\n"
                   + (split("\n") | map(select(length > 0)) | map("- " + .) | join("\n"))
                   + "\n\nThe description becomes the squash-merge commit message and the changelog entry, so it ships permanently.")}' \
          < .review-context/description-findings.txt > description-review.json
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" -X POST --input description-review.json >/dev/null \
          && echo "::notice::posted the description findings the review left out" \
          || echo "::warning::could not post the description findings"

    # A killed run - idle watchdog, job timeout, provider stall - otherwise
    # posts nothing at all, and the review is a total loss: the check fails
    # with no feedback and the author has to push again, paying a whole CI
    # cycle, to find out what the review would have said. The prompt asks the
    # review to write its findings to review.json as it reaches them rather
    # than only at the end, so whatever it had reached is on disk when it
    # dies. This posts that.
    #
    # Never an approval. An approval that was never actually reached is the
    # one outcome worse than silence, because auto-merge acts on it. A
    # salvaged review is always REQUEST_CHANGES, and the step leaves the job
    # failed either way - the salvage is feedback for the author, not a
    # verdict for the merge gate.
    - name: Salvage an unposted review
      if: failure() && steps.human_approval.outputs.found != 'true' && steps.dependency_only.outputs.match != 'true' && steps.content_changed.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        PR_NUMBER: ${{ env.PR_NUMBER }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail

        [ -f review.json ] || { echo "no review.json to salvage"; exit 0; }
        jq -e . review.json >/dev/null 2>&1 || { echo "review.json is not valid JSON — nothing to salvage"; exit 0; }

        findings=$(jq -r '(.comments // []) | length' review.json)
        summary=$(jq -r '.body // "" | length' review.json)
        if [ "$findings" = "0" ] && [ "$summary" = "0" ]; then
          echo "review.json carries no findings — nothing to salvage"
          exit 0
        fi

        # The posted event is forced regardless of what the file says, so a
        # half-written file that happens to carry event APPROVE cannot
        # approve anything.
        note="This review was cut short before it finished — the run was killed by the watchdog or the job timeout. What follows is what it had reached, and it does **not** cover the whole diff. The check is failed; push to re-run a full review."
        jq --arg n "$note" \
          '.event = "REQUEST_CHANGES" | .body = ($n + "\n\n" + (.body // ""))' \
          review.json > review-salvaged.json

        if gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" -X POST --input review-salvaged.json ; then
          echo "::notice::salvaged a partial review with ${findings} finding(s) from a killed run"
        else
          # A comments[] entry anchored outside the diff hunks 422s the whole
          # POST. Falling back to a body-only review keeps the findings
          # readable rather than losing them to a formatting rejection.
          echo "::warning::salvage POST rejected — retrying with the findings in the body"
          jq --arg n "$note" \
            '{event: "REQUEST_CHANGES", body: ($n + "\n\n" + (.body // "") + "\n\n" + ((.comments // []) | map("- **" + .path + ":" + ((.line // 0) | tostring) + "** — " + .body) | join("\n\n")))}' \
            review.json > review-salvaged-body.json
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" -X POST --input review-salvaged-body.json \
            && echo "::notice::salvaged a partial review as a body-only review" \
            || echo "::warning::salvage failed — the run posted nothing"
        fi

    # always(), because the runs worth reading are the ones that failed or were
    # killed. Artifacts are uploaded verbatim and secret masking does not apply to
    # them the way it does to the log, so the provider auth token in use (by its
    # exact value) and any token-shaped strings are redacted first. The token, if
    # any, arrived via $GITHUB_ENV in the credential-resolution step, so it is read
    # here as a plain process env var rather than through the `${{ env.* }}`
    # expression context (which does not see $GITHUB_ENV writes).
    - name: Redact and compress the transcript
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        DIR="${RUNNER_TEMP}/review-logs"
        [ -d "$DIR" ] || { echo "no transcript to upload"; exit 0; }
        REDACT_KEY="${ANTHROPIC_AUTH_TOKEN:-${CLAUDE_CODE_OAUTH_TOKEN:-}}"
        if [ -n "$REDACT_KEY" ]; then
          REDACT_KEY="$REDACT_KEY" find "$DIR" -type f -exec perl -pi -e 's/\Q$ENV{REDACT_KEY}\E/REDACTED/g' {} +
        fi
        if grep -rlE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9-]{20,}' "$DIR" >/dev/null 2>&1; then
          echo "::warning::token-shaped strings found in the transcript — redacting before upload"
          find "$DIR" -type f -exec sed -i -E 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9-]{20,}/REDACTED/g' {} +
        fi
        gzip -9 "$DIR"/*.json 2>/dev/null || true
        ls -lh "$DIR"

    - name: Upload review transcript
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: review-transcript-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/review-logs/
        retention-days: ${{ inputs.transcript-retention-days }}
        if-no-files-found: ignore
